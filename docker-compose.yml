# SwarmVault WebApp — Production Docker Compose
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: swarmvault
      POSTGRES_PASSWORD: ${SWARMMAULT_DB_PASSWORD:-change-me-in-production}
      POSTGRES_DB: swarmvault
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarmvault"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swarmvault

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Required — set these in .env or deployment secret manager
      SECRET_KEY: ${SECRET_KEY:-}
      DATABASE_URL: postgresql+asyncpg://swarmvault:${DB_PASSWORD:-change-me-in-production}@postgres:5432/swarmvault
      ENVIRONMENT: production
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Optional LLM
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app_storage:/app/storage
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - swarmvault

volumes:
  postgres_data:
  app_storage:
  app_logs:

networks:
  swarmvault:
